<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <title>Distill</title>
    <script>
      // Applies theme/text-size/motion settings before first paint, so
      // there's no flash of the wrong theme while React boots. Mirrors
      // applySettingsToDocument() in src/lib/settings.ts — kept as plain,
      // un-bundled JS here specifically so it can run synchronously,
      // blocking, before anything else.
      (function () {
        try {
          var raw = localStorage.getItem('distill:settings')
          var s = raw ? JSON.parse(raw) : {}
          var theme = s.theme || 'system'
          var reducedMotion = s.reducedMotion || 'system'
          var textSize = s.textSize || 'medium'

          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var isReducedMotion = reducedMotion === 'on' || (reducedMotion === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          var scale = { small: '0.9375', medium: '1', large: '1.125' }[textSize] || '1'

          var root = document.documentElement
          if (isDark) root.classList.add('dark')
          if (isReducedMotion) root.classList.add('motion-reduce')
          root.style.setProperty('--text-scale', scale)
        } catch (e) {
          // localStorage unavailable or malformed JSON — fall back to defaults silently.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
