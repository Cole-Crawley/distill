<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <title>Distill — Offline</title>
    <style>
      /* Deliberately plain, dependency-free CSS: this page is the very last
         resort Workbox falls back to when even the cached app shell can't
         be found, so it can't assume Tailwind, fonts, or anything else
         built by Vite is available. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: #faf9f6;
        color: #1c1917;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      p {
        color: #78716c;
        max-width: 26rem;
        margin: 0;
        font-size: 0.95rem;
      }
      button {
        margin-top: 8px;
        background-color: #4a7c59;
        color: #faf9f6;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background-color: #2d5a3d;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Distill couldn't load right now. If you've opened it before on this device, try reloading —
      your notes are stored locally and don't need an internet connection once the app is cached.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
